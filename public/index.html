<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የአመክሮ ቤተሰብ አባላት መከታተያ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Login Section -->
    <div id="login-section" class="sacred-container">
      <div class="login-card">
        <h1>የአመክሮ ቤተሰብ አባላት መከታተያ</h1>
        <form id="login-form">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="login-username" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-container">
              <input type="password" id="login-password" required>
              <button type="button" class="toggle-password" data-target="login-password"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="btn-gold">ግባ / ይመዝገቡ</button>
          <div id="login-error" class="error-message"></div>
        </form>
      </div>
      <div class="candle-stand">
        <div class="candle" id="prayer-candle">
          <div class="flame" id="candle-flame"></div>
          <div class="wick"></div>
          <div class="wax"></div>
        </div>
        <div><span id="candle-count">0</span> ሻማዎች ተቀጥለዋል</div>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-app" style="display: none;">
      <header>
        <h2 id="user-name-display"></h2>
        <span id="user-role-badge"></span>
        <button id="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
        <nav>
          <button class="nav-btn" data-view="tasks"><i class="fas fa-check-circle"></i> ሥራዎች</button>
          <button class="nav-btn admin-only" data-view="dashboard"><i class="fas fa-chart-line"></i> ዳሽቦርድ</button>
          <button class="nav-btn admin-only" data-view="admin"><i class="fas fa-users-cog"></i> አስተዳደር</button>
          <button class="nav-btn admin-only" data-view="analytics"><i class="fas fa-chart-simple"></i> ሪፖርቶች</button>
        </nav>
      </header>

      <div id="tasks-view" class="view-container">
        <div class="daily-inspiration">
          <div id="inspiration-text"></div>
          <div id="inspiration-source"></div>
          <button id="new-inspiration">አዲስ</button>
        </div>
        <div class="date-selector">
          <input type="date" id="task-date-selector">
        </div>
        <div id="tasks-list-container"></div>
      </div>

      <div id="dashboard-view" class="view-container admin-only" style="display: none;">
        <div id="stats-grid" class="stats-grid"></div>
      </div>

      <div id="admin-view" class="view-container admin-only" style="display: none;">
        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="users">ተጠቃሚዎች</button>
          <button class="admin-tab" data-tab="create">አዲስ መፍጠር</button>
          <button class="admin-tab root-only" data-tab="create-root">አስተዳዳሪ መፍጠር</button>
          <button class="admin-tab root-only" data-tab="audit">የሥራ መዝገብ</button>
        </div>
        <div id="users-tab"><div id="users-list"></div></div>
        <div id="create-tab" style="display: none;">
          <form id="create-user-form">
            <input type="text" id="new-username" placeholder="Username" required>
            <div class="password-container">
              <input type="password" id="new-password" placeholder="Password" required>
              <button type="button" class="toggle-password" data-target="new-password"><i class="fas fa-eye"></i></button>
            </div>
            <input type="text" id="new-fullname" placeholder="Full Name">
            <select id="new-role"><option value="standard">Standard User</option><option value="admin">Admin</option></select>
            <button type="submit">Create User</button>
          </form>
        </div>
        <div id="create-root-tab" class="root-only" style="display: none;">
          <form id="create-root-admin-form">
            <input type="text" id="root-username" placeholder="Username" required>
            <div class="password-container">
              <input type="password" id="root-password" placeholder="Password" required>
              <button type="button" class="toggle-password" data-target="root-password"><i class="fas fa-eye"></i></button>
            </div>
            <input type="text" id="root-fullname" placeholder="Full Name">
            <button type="submit">Create Admin</button>
          </form>
        </div>
        <div id="audit-tab" class="root-only" style="display: none;"><div id="audit-logs-container"></div></div>
      </div>

      <div id="analytics-view" class="view-container admin-only" style="display: none;">
        <div class="stats-summary">
          <div class="stat-card"><div class="stat-value" id="overall-percentage">0%</div><div class="stat-label">አጠቃላይ ማጠናቀቅ</div></div>
          <div class="stat-card"><div class="stat-value" id="total-members">0</div><div class="stat-label">አባላት</div></div>
        </div>
        <canvas id="trends-chart"></canvas>
        <div id="user-progress-list"></div>
        <div class="export-section">
          <button id="export-json">JSON</button>
          <button id="export-csv">CSV</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/script.js"></script>
</body>
</html>
