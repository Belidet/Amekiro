<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#800020">
  <meta name="description" content="የአመክሮ ቤተሰብ አባላት መከታተያ - Spiritual task tracking for Orthodox families">
  <title>የአመክሮ ቤተሰብ አባላት መከታተያ</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/cross.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Login Section -->
    <div id="login-section" class="sacred-container">
      <div class="login-card">
        <div class="icon-wrapper">
          <i class="fas fa-cross"></i>
        </div>
        <h1>የአመክሮ ቤተሰብ አባላት መከታተያ</h1>
        <p class="subtitle">Family Members Tracker</p>
        <form id="login-form">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Username</label>
            <input type="text" id="login-username" required placeholder="Enter username">
          </div>
          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <div class="password-container">
              <input type="password" id="login-password" required placeholder="Enter password">
              <button type="button" class="toggle-password" data-target="login-password" aria-label="Show/hide password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-gold">ግባ / ይመዝገቡ <i class="fas fa-arrow-right"></i></button>
          <div id="login-error" class="error-message"></div>
          <div id="login-status" class="status-message" style="font-size: 12px; margin-top: 10px; text-align: center;"></div>
        </form>
        <div class="first-user-note">
          ✨ First user to register becomes the Administrator ✨
        </div>
      </div>
      <div class="candle-stand">
        <div class="candle" id="prayer-candle">
          <div class="flame" id="candle-flame"></div>
          <div class="wick"></div>
          <div class="wax"></div>
        </div>
        <div class="candle-counter">
          <span id="candle-count">0</span> ሻማዎች ተቀጥለዋል
        </div>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-app" style="display: none;">
      <header class="main-header">
        <div class="header-content">
          <div class="church-icon">⛪</div>
          <h2 id="user-name-display"></h2>
          <span id="user-role-badge" class="role-badge"></span>
          <button id="logout-btn" class="btn-icon"><i class="fas fa-sign-out-alt"></i></button>
        </div>
        <nav class="sacred-nav">
          <button class="nav-btn" data-view="tasks"><i class="fas fa-check-circle"></i> ሥራዎች</button>
          <button class="nav-btn admin-only" data-view="dashboard"><i class="fas fa-chart-line"></i> ዳሽቦርድ</button>
          <button class="nav-btn admin-only" data-view="admin"><i class="fas fa-users-cog"></i> አስተዳደር</button>
          <button class="nav-btn admin-only" data-view="analytics"><i class="fas fa-chart-simple"></i> ሪፖርቶች</button>
        </nav>
      </header>

      <!-- Tasks View (for Standard Users) -->
      <div id="tasks-view" class="view-container">
        <div class="daily-inspiration arched-panel">
          <div class="scroll-icon"><i class="fas fa-scroll"></i></div>
          <h3><i class="fas fa-quote-right"></i> የዕለቱ መንፈሳዊ ማበረታቻ</h3>
          <div id="inspiration-text" class="inspiration-text">እግዚአብሔር ፍቅር ነው።</div>
          <div id="inspiration-source" class="inspiration-source">1 ዮሐንስ 4:8</div>
          <button id="new-inspiration" class="btn-small"><i class="fas fa-sync-alt"></i> አዲስ መልእክት</button>
        </div>
        <div class="date-selector">
          <label><i class="fas fa-calendar-day"></i> ቀን ምረጥ</label>
          <input type="date" id="task-date-selector" class="date-input">
        </div>
        <div class="arched-panel">
          <h3><i class="fas fa-tasks"></i> የዕለቱ ሥራዎች</h3>
          <div id="tasks-list-container" class="tasks-list"></div>
        </div>
      </div>

      <!-- Dashboard View (Admin Only) -->
      <div id="dashboard-view" class="view-container admin-only" style="display: none;">
        <div class="arched-panel">
          <h2><i class="fas fa-chart-line"></i> አጠቃላይ እይታ</h2>
          <div id="stats-grid" class="stats-grid"></div>
        </div>
      </div>

      <!-- Admin View -->
      <div id="admin-view" class="view-container admin-only" style="display: none;">
        <div class="arched-panel">
          <h2><i class="fas fa-users-cog"></i> ተጠቃሚዎች አስተዳደር</h2>
          <div class="admin-tabs">
            <button class="admin-tab active" data-tab="users">ተጠቃሚዎች</button>
            <button class="admin-tab" data-tab="create">አዲስ መፍጠር</button>
            <button class="admin-tab root-only" data-tab="create-root">አስተዳዳሪ መፍጠር</button>
            <button class="admin-tab root-only" data-tab="audit">የሥራ መዝገብ</button>
          </div>
          
          <div id="users-tab" class="admin-tab-content active">
            <div id="users-list" class="users-list"></div>
          </div>
          
          <div id="create-tab" class="admin-tab-content" style="display: none;">
            <form id="create-user-form">
              <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" id="new-username" placeholder="Username" required>
              </div>
              <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="password-container">
                  <input type="password" id="new-password" placeholder="Password" required>
                  <button type="button" class="toggle-password" data-target="new-password">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
              </div>
              <div class="form-group">
                <label><i class="fas fa-tag"></i> Full Name</label>
                <input type="text" id="new-fullname" placeholder="Full Name">
              </div>
              <div class="form-group">
                <label><i class="fas fa-user-tag"></i> Role</label>
                <select id="new-role">
                  <option value="standard">Standard User</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <button type="submit" class="btn-gold"><i class="fas fa-user-plus"></i> ተጠቃሚ መፍጠር</button>
            </form>
          </div>
          
          <div id="create-root-tab" class="admin-tab-content root-only" style="display: none;">
            <form id="create-root-admin-form">
              <div class="form-group">
                <label><i class="fas fa-crown"></i> Username</label>
                <input type="text" id="root-username" placeholder="Username" required>
              </div>
              <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="password-container">
                  <input type="password" id="root-password" placeholder="Password" required>
                  <button type="button" class="toggle-password" data-target="root-password">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
              </div>
              <div class="form-group">
                <label><i class="fas fa-user-circle"></i> Full Name</label>
                <input type="text" id="root-fullname" placeholder="Full Name">
              </div>
              <div class="warning-box">
                <i class="fas fa-exclamation-triangle"></i> New admin will have full system access
              </div>
              <button type="submit" class="btn-gold"><i class="fas fa-crown"></i> አስተዳዳሪ መፍጠር</button>
            </form>
          </div>
          
          <div id="audit-tab" class="admin-tab-content root-only" style="display: none;">
            <div id="audit-logs-container" class="audit-logs"></div>
          </div>
        </div>
      </div>

      <!-- Analytics View (Admin Only) -->
      <div id="analytics-view" class="view-container admin-only" style="display: none;">
        <div class="arched-panel">
          <h2><i class="fas fa-chart-simple"></i> የአባላት እድገት</h2>
          <div class="stats-summary">
            <div class="stat-card">
              <div class="stat-value" id="overall-percentage">0%</div>
              <div class="stat-label">አጠቃላይ ማጠናቀቅ</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="total-members">0</div>
              <div class="stat-label">አባላት</div>
            </div>
          </div>
          <canvas id="trends-chart" style="max-height: 300px; width: 100%;"></canvas>
          <h3><i class="fas fa-users-viewfinder"></i> የአባላት እድገት</h3>
          <div id="user-progress-list" class="user-progress-list"></div>
          <div class="export-section">
            <button id="export-json" class="btn-small"><i class="fas fa-file-json"></i> እንደ JSON አውርድ</button>
            <button id="export-csv" class="btn-small"><i class="fas fa-file-csv"></i> እንደ CSV አውርድ</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Optional: Register service worker for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker registration failed:', err));
    }
  </script>
  <script src="/script.js"></script>
</body>
</html>
